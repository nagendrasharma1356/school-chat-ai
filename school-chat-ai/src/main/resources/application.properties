spring.application.name=school-chat-ai
server.port=${SERVER_PORT:8090}

# ---- MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_chat}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.seed-data=true

#Gemini (Google AI Studio)

gemini.api-key=${GEMINI_API_KEY:AQ.Ab8RN6ILhdjvVsg87Z_ja1IDuQuTZJc1NBtH32TRaSej89vDww}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite
gemini.temperature=0.1
gemini.max-output-tokens=512
gemini.timeout-seconds=30
